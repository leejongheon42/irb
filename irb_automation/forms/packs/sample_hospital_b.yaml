# 다른 병원 스타일 예시 — 과제번호 형식·필수 기관 항목·필수 웹 서식이 다른 경우.
# 가져오기 화면에서 '기관 프로필도 적용'을 선택하면 기관명·과제번호 형식까지 바뀐다.
pack: sample_hospital_b
name: △△의료원 양식 팩(예시)
description: 과제번호 "{YY}-{SEQ:3}-B", 필수 기관 항목(진료과장 승인·심의비 구분·분석 환경), 필수 웹 서식(자료 이용 신청서)
profile:
  institution_name: △△의료원
  irb_name: △△의료원 연구윤리심의위원회
  protocol_no_format: "{YY}-{SEQ:3}-B"
  letter_footer: 본 통지서는 △△의료원 연구윤리심의위원회 표준운영지침(SOP v5.2)에 따라 발행되었습니다.
  contact: "연구윤리심의위원회 사무국 · 02-000-0000 · irb@example.org"
forms:
  - kind: protocol
    name: △△의료원 과제 신청서 추가 항목
    schema:
      sections:
        - title: 기관 행정 정보
          fields:
            - key: dept_head_approval
              label: 소속 진료과장의 사전 승인을 받았습니다
              type: checkbox
              required: true
            - key: irb_fee_category
              label: 심의비 구분
              type: select
              required: true
              options:
                - {value: internal, label: 원내 과제}
                - {value: public, label: 정부·공공기관 지원}
                - {value: industry, label: 기업 후원}
                - {value: waived, label: 면제(학위논문 등)}
            - key: fee_paid
              label: 심의비 납부 완료
              type: yesno
              required: true
              show_when: {field: irb_fee_category, equals: industry}
            - key: budget_code
              label: 연구비 예산 코드
              type: text
              show_when: {field: funding_source}
        - title: 데이터 활용 계획
          fields:
            - key: analysis_env
              label: 분석 환경
              type: select
              required: true
              material: true
              options:
                - {value: internal_server, label: 원내 분석서버}
                - {value: safe_center, label: 안심활용센터}
                - {value: external_cloud, label: 외부 클라우드(보안인증)}
            - key: expected_rows
              label: 추출 예상 행 수
              type: number
              min: 1
              max: 10000000
              help: 데이터센터 추출 규모 산정용
            - key: dmp_summary
              label: 자료관리계획 요약
              type: textarea

  - kind: online:coi
    name: 이해상충 신고서(△△의료원)
    schema:
      label: 이해상충 신고서
      per_member: true
      required: true
      intro: 연구진 각자 작성합니다.
      pledge: 신고 내용이 사실임을 확인합니다.
      sections:
        - title: 신고 내용
          fields:
            - {key: coi_exists, label: "신고할 이해상충이 있습니까?", type: yesno, required: true}
            - key: coi_detail
              label: 이해상충 내용
              type: textarea
              required: true
              show_when: {field: coi_exists, equals: yes}

  - kind: online:data_access_request
    name: 자료 이용 신청서(△△의료원)
    schema:
      label: 자료 이용 신청서
      per_member: false
      signer: pi
      required: true
      intro: 데이터센터 자료 추출 전 연구책임자가 작성합니다.
      pledge: 신청한 범위의 자료만 이용할 것을 확인합니다.
      sections:
        - title: 신청 내용
          fields:
            - {key: data_scope, label: 요청 자료 범위(기간·대상·항목), type: textarea, required: true}
            - key: extraction_method
              label: 추출 방식
              type: select
              required: true
              options:
                - {value: cdw_self, label: CDW 직접 추출}
                - {value: center, label: 데이터센터 의뢰}
            - key: delivery
              label: 제공 방식
              type: select
              required: true
              options:
                - {value: file, label: 가명정보 파일}
                - {value: account, label: 분석서버 계정}
            - {key: justification, label: 자료 필요성, type: textarea, required: true}
            - {key: applicant, label: 신청자, type: text, required: true, prefill: pi.full_name}

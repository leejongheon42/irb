# =====================================================================
#  IRB 자동 사전검토 기본 규칙 세트
# ---------------------------------------------------------------------
#  - 의료데이터(기존 자료·문서) 활용 연구를 중심으로 작성된 기본값이다.
#  - 각 기관의 IRB 표준운영지침(SOP)에 맞게 반드시 검토·수정하여 사용한다.
#  - 자동 분류 결과는 "권고"이며, 최종 판단은 IRB가 한다.
#  - 법령 조문은 작성 시점 기준이며 개정 여부를 주기적으로 확인해야 한다.
# =====================================================================
version: "2026.11-default"

legal_basis:
  bioethics_15: "생명윤리법 제15조(인간대상연구의 심의)"
  bioethics_15_2: "생명윤리법 제15조제2항 및 같은 법 시행규칙 제13조(기관위원회 심의 면제)"
  bioethics_16_3: "생명윤리법 제16조제3항(서면동의 면제 요건)"
  bioethics_18: "생명윤리법 제18조(개인정보의 제공)"
  bioethics_3_5: "생명윤리법 제3조제5항(취약한 환경에 있는 개인·집단의 특별 보호)"
  bioethics_11: "생명윤리법 제11조(기관위원회의 구성 및 운영 등)"
  bioethics_12: "생명윤리법 제12조(공동 기관위원회 등)"
  bioethics_14: "생명윤리법 제14조(기관위원회의 평가 및 인증)"
  pipa_23: "개인정보 보호법 제23조(민감정보의 처리 제한)"
  pipa_24: "개인정보 보호법 제24조(고유식별정보의 처리 제한)"
  pipa_24_2: "개인정보 보호법 제24조의2(주민등록번호 처리의 제한)"
  pipa_28_2: "개인정보 보호법 제28조의2(가명정보의 처리 등)"
  pipa_28_3: "개인정보 보호법 제28조의3(가명정보의 결합 제한)"
  pipa_28_4: "개인정보 보호법 제28조의4(가명정보에 대한 안전조치의무 등)"
  pipa_28_5: "개인정보 보호법 제28조의5(가명정보 처리 시 금지의무 등)"
  pipa_28_8: "개인정보 보호법 제28조의8(개인정보의 국외 이전)"
  pipa_29: "개인정보 보호법 제29조(안전조치의무)"
  medical_21: "의료법 제21조(기록 열람 등)"
  guideline: "보건의료데이터 활용 가이드라인(보건복지부·개인정보보호위원회)"

# 위험도 점수 구간 (이상 ~ 이하)
risk_levels:
  - {key: low, label: "최소위험", max: 19}
  - {key: moderate, label: "최소위험 초과(경미)", max: 44}
  - {key: high, label: "고위험", max: 1000}

review_type:
  # 이 점수를 초과하면 정규심의 권고
  expedited_max_score: 44
  # 심의면제 판단 옵션
  exemption:
    allow_pseudonymized: true          # 연구자가 식별정보에 접근하지 않는 가명정보 연구 면제 허용
    excluded_sensitive: [genetic, biometric, hiv_std]
    excluded_vulnerable: [children, pregnant, cognitively_impaired, prisoners, subordinates, emergency, terminally_ill, institutionalized]
    exclude_international_transfer: true
    exclude_data_linkage: true
  # 아래 조합이 하나라도 해당하면 정규심의 권고
  full_board_triggers:
    identifiable_with_vulnerable: [children, cognitively_impaired, prisoners]
    identifiable_with_sensitive: [genetic, hiv_std, mental_health, criminal]
    identifiable_international_transfer: true
    identifiable_commercial_use: true
    direct_contact_with_vulnerable: true


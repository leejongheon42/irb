# 필수 서류 규칙: when 의 조건을 모두 만족하면 필요. 조건명은 engine/checklist.py 참조.
required_documents:
  - {doc: application, when: [not_exempt]}
  - {doc: exemption_request, when: [exempt]}
  - {doc: protocol, when: []}
  - {doc: cv, when: []}
  - {doc: training_cert, when: []}
  - {doc: coi, when: []}
  - {doc: consent_form, when: [consent_obtain]}
  - {doc: waiver_request, when: [consent_waiver, not_exempt]}
  - {doc: crf, when: []}
  - {doc: deid_plan, when: [not_anonymized]}
  - {doc: security_pledge, when: [not_anonymized]}
  - {doc: transfer_agreement, when: [external_transfer]}
  - {doc: linkage_plan, when: [data_linkage]}
  - {doc: budget, when: [funded]}
  - {doc: progress_report, when: [kind_continuing]}
  - {doc: final_report, when: [kind_final_report]}
  - {doc: external_irb_approval, when: [review_external]}
  - {doc: site_list, when: [multicenter_lead]}

# 가명처리 도구 기본 정책
deid_policy:
  k_threshold: 5            # k-익명성 최소 기준
  l_threshold: 2            # l-다양성 최소 기준(민감속성 지정 시)
  max_risk_record_ratio: 0.05  # k 미만 레코드 허용 비율(초과 시 부적정)
  age_band_years: 5
  age_top_code: 90
  date_shift_max_days: 30
  address_level: sigungu    # sido | sigungu

# 기관위원회 회의 운영 정책 (생명윤리법 제11조 및 기관 SOP)
committee:
  min_members: 5                 # 위원장 포함 최소 위원 수
  require_both_genders: true     # 하나의 성으로만 구성 불가
  min_lay_members: 1             # 사회적·윤리적 타당성 평가 위원
  min_external_members: 1        # 기관 비종사자
  quorum: majority_of_members    # 재적위원 과반수 출석
  approval: majority_of_present  # 출석위원 과반수 찬성
  require_lay_present: true      # 기관 SOP: 비과학계 위원 출석 필수
  require_external_present: false

# IRB 승인 전 대상자 수 사전 조회(feasibility) 정책
feasibility_policy:
  min_cell: 10          # 이 값 미만은 "<10"으로 표시
  rounding: 10          # 결과를 이 단위로 반올림
  daily_limit: 50       # 사용자별 일일 조회 한도(차분 공격 완화)

# 분석 결과 반출 심사(airlock) 정책
output_check:
  min_cell: 5           # 집계표의 최소 셀 크기(이 값 미만 셀은 억제)
  allow_zero: true      # 0 셀 허용 여부
  max_rows_aggregate: 1000   # 이 행 수를 넘으면 개인 단위 자료 의심
  suppression_label: "<5"

# 자료 파기 관리
destruction_policy:
  reminder_days: [60, 30, 7]

# 계약 만료 알림
agreement_policy:
  reminder_days: [60, 30]

# === 관련 정보 검색(지식베이스) ===
knowledge:
  bm25_k1: 1.2            # 단어 빈도 포화 정도
  bm25_b: 0.75            # 문서 길이 정규화 정도
  title_boost: 2          # 제목·조문·소제목 토큰 가중치(배수)
  snippet_chars: 220      # 검색 결과 발췌 길이
  answer_max_chunks: 6    # 질의응답에 사용할 최대 근거 수
  ai_answer_max_tokens: 4000
  # 과거 과제·심의 선례를 전체 열람할 수 있는 역할(그 외 사용자는 본인이 열람 가능한 과제만)
  precedent_roles: [coordinator, chair, admin, reviewer]

# === 웹 문서 제출 ===
submission:
  max_files_per_upload: 20        # 한 번에 제출 가능한 파일 수
  reject_encrypted_pdf: true      # 비밀번호 없이 열 수 없는 PDF는 거부(검토·도장·합본 불가)
  warn_pdf_active_content: true   # PDF 내 JavaScript·실행 동작·내장 파일 경고
  stamp_doc_types: [consent_form, protocol]   # 승인·시정승인·면제확인 시 승인 도장본을 만들 서류
  stamp_all_pages: true           # false면 첫 쪽에만 도장
  # 승인·면제 이후에도(변경 신청 없이) 제출 가능한 서류
  report_doc_types: [progress_report, final_report, destruction_certificate, other]

# === 문서 자동화 파이프라인 ===
# 기관마다 다른 서식 명칭을 추가로 인식시키려면 아래에 덧붙인다(공백·기호는 무시하고 비교).
document_pipeline:
  # 섹션 제목 별칭: title, objectives, background, methods, target_population, inclusion_criteria,
  # exclusion_criteria, expected_subjects, sample_size_justification, study_period, data_period,
  # data_items, privacy, consent, retention, funding, pi_name, department
  field_aliases:
    title: ["임상연구과제명", "연구과제명국문"]
    data_period: ["후향적의무기록조사기간"]
  # 서류 분류 키워드: 서류종류: [키워드 또는 [키워드, 가중치]]
  classify_keywords:
    protocol: [["임상연구 심의 신청서", 3]]

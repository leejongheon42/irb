<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · IRB 자동화</title>
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand-lg">IRB 자동화 솔루션</div>
    <p class="muted">{{ settings.irb_name }}</p>
    {% for f in flashes %}<div class="flash {{ f.category }}">{{ f.message }}</div>{% endfor %}
    <form method="post" action="/login">
      {{ csrf_input }}
      <label for="username">아이디</label>
      <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <p><button class="btn-primary" type="submit">로그인</button></p>
    </form>
    <p class="small muted">5회 연속 실패 시 10분간 잠금됩니다. 모든 접속 기록은 감사 로그에 저장됩니다.</p>
  </div>
</div>
</body>
</html>

# 법령 요약 — 원문이 아니며 개정 가능성이 있습니다. 최종 판단은 국가법령정보센터 원문을 확인하십시오.
# version을 올리면 다음 실행 시 지식베이스가 갱신됩니다.
version: "2026.11"
sources:
  - key: law:bioethics-11
    kind: law
    title: 생명윤리법 제11조 — 기관위원회의 구성 및 운영 (요약 — 원문 확인 필요)
    ref: 생명윤리법 제11조
    url: https://www.law.go.kr/법령/생명윤리및안전에관한법률
    sections:
      - heading: 구성 요건(요지)
        text: |
          기관생명윤리위원회(기관위원회)는 위원장 1명을 포함하여 5명 이상의 위원으로 구성하며, 하나의 성(性)으로만 구성할 수 없다.
          사회적·윤리적 타당성을 평가할 수 있는 경험과 지식을 갖춘 사람 1명 이상과, 그 기관에 종사하지 아니하는 사람 1명 이상이 포함되어야 한다.
      - heading: 운영(요지)
        text: |
          심의 대상 연구에 관여하는 위원은 해당 연구의 심의에 참여하지 않도록 하는 등 이해상충을 관리해야 한다.
          회의 의결 방법·정족수 등 운영 세부는 하위 법령과 기관 표준운영지침(SOP)에 따른다. 세부 조항은 원문을 확인한다.

  - key: law:bioethics-12
    kind: law
    title: 생명윤리법 제12조 — 공용기관생명윤리위원회 등 (요약 — 원문 확인 필요)
    ref: 생명윤리법 제12조
    url: https://www.law.go.kr/법령/생명윤리및안전에관한법률
    sections:
      - heading: 요지
        text: |
          기관위원회를 두기 어려운 기관 등이 심의를 받을 수 있도록 공용기관생명윤리위원회를 지정·운영하는 근거 등을 규정한다.
          다기관 공동연구에서 심의를 다른 위원회에 위탁하거나 결과를 인정할 때 참고한다. 위탁·인정 절차의 세부는 원문과 기관 SOP를 확인한다.

  - key: law:bioethics-14
    kind: law
    title: 생명윤리법 제14조 — 기관위원회의 평가 및 인증 (요약 — 원문 확인 필요)
    ref: 생명윤리법 제14조
    url: https://www.law.go.kr/법령/생명윤리및안전에관한법률
    sections:
      - heading: 요지
        text: |
          보건복지부장관은 기관위원회의 구성 및 운영실적 등을 평가하여 인증할 수 있으며, 평가·인증 업무는 국가생명윤리정책원이 운영한다.
          공고 기준 인증 유효기간은 3년이며, 인증 기관은 연간 운영실적과 표준운영지침 변경사항 등을 연차보고한다.

  - key: law:bioethics-15
    kind: law
    title: 생명윤리법 제15조 — 인간대상연구의 심의 (요약 — 원문 확인 필요)
    ref: 생명윤리법 제15조
    url: https://www.law.go.kr/법령/생명윤리및안전에관한법률
    sections:
      - heading: 심의 의무(제1항 요지)
        text: |
          인간대상연구를 하려는 자는 연구를 하기 전에 연구계획서에 대하여 기관위원회의 심의를 받아야 한다.
          의료기록·검사결과 등 기존 자료를 이용하는 연구도 인간대상연구에 해당할 수 있으므로 심의 또는 심의면제 확인이 필요하다.
      - heading: 심의 면제(제15조제2항 요지)
        text: |
          연구대상자 및 공공에 미치는 위험이 미미한 경우로서 국가위원회의 심의를 거쳐 보건복지부령으로 정한 기준에 맞는 연구는 기관위원회의 심의를 면제할 수 있다.
          면제 기준은 같은 법 시행규칙 제13조에 있으며, 면제 여부는 연구자가 스스로 정하지 않고 기관위원회의 확인을 받는 것이 일반적이다.

  - key: law:bioethics-rule-13
    kind: law
    title: 생명윤리법 시행규칙 제13조 — 심의를 면제할 수 있는 인간대상연구 (요약 — 원문 확인 필요)
    ref: 생명윤리법 시행규칙 제13조
    url: https://www.law.go.kr/법령/생명윤리및안전에관한법률시행규칙
    sections:
      - heading: 면제 기준(요지)
        text: |
          일반대중에게 공개된 정보를 이용하는 연구 또는 개인식별정보를 수집·기록하지 않는 연구로서 정해진 유형에 해당하는 연구가 면제 대상이 될 수 있다.
          유형에는 침습적 행위 없이 연구대상자나 환경을 조작하는 일부 연구, 직접 대면하더라도 연구대상자가 특정되지 않고 민감정보를 수집·기록하지 않는 연구, 연구대상자 등에 대한 기존의 자료나 문서를 이용하는 연구 등이 포함된다.
      - heading: 의료데이터 연구 적용 시 유의
        text: |
          기존 의무기록·CDW 자료를 이용하더라도 연구자가 식별정보(성명, 등록번호, 주민등록번호 등)를 수집·기록하면 면제 요건을 충족하기 어렵다.
          가명정보만 제공받고 추가정보에 접근하지 않는 경우의 면제 인정 여부, 취약한 연구대상자 포함 연구의 면제 제외 여부는 기관 SOP에 따라 달라질 수 있다.

  - key: law:bioethics-16
    kind: law
    title: 생명윤리법 제16조 — 인간대상연구의 동의 (요약 — 원문 확인 필요)
    ref: 생명윤리법 제16조
    url: https://www.law.go.kr/법령/생명윤리및안전에관한법률
    sections:
      - heading: 서면동의(제1항·제2항 요지)
        text: |
          인간대상연구자는 연구 전에 연구대상자로부터 연구 목적, 참여 기간·절차·방법, 예상되는 위험과 이득, 개인정보 보호와 제공, 손실 보상, 동의 철회 등이 포함된 서면동의(전자문서 포함)를 받아야 한다.
          동의 능력이 없거나 불완전한 연구대상자는 법정대리인 등의 동의 절차가 별도로 규정되어 있다.
      - heading: 동의 면제 요건(제16조제3항 요지)
        text: |
          다음 두 요건을 모두 갖춘 경우 기관위원회의 승인을 받아 연구대상자의 서면동의를 면제할 수 있다.
          첫째, 연구대상자의 동의를 받는 것이 연구 진행과정에서 현실적으로 불가능하거나 연구의 타당성에 심각한 영향을 미친다고 판단되는 경우.
          둘째, 연구대상자의 동의 거부를 추정할 만한 사유가 없고, 동의를 면제하여도 연구대상자에게 미치는 위험이 극히 낮은 경우.
          후향적 의무기록 연구에서는 대상자 규모, 사망·추적 불가, 선택편향 등을 구체적으로 소명하고 가명처리로 위험을 낮추는 것이 일반적이다.

  - key: law:bioethics-18
    kind: law
    title: 생명윤리법 제18조 — 개인정보의 제공 (요약 — 원문 확인 필요)
    ref: 생명윤리법 제18조
    url: https://www.law.go.kr/법령/생명윤리및안전에관한법률
    sections:
      - heading: 요지
        text: |
          연구대상자로부터 개인정보 제공에 대한 서면동의를 받은 경우 기관위원회의 심의를 거쳐 개인정보를 제3자에게 제공할 수 있다.
          제3자에게 제공할 때에는 익명화하는 것이 원칙이며, 연구대상자가 개인식별정보를 포함하는 것에 동의한 경우는 예외로 한다.
          외부 기관에 자료를 제공할 때에는 자료 제공 계약(재제공 금지, 목적 외 이용 금지, 파기 의무)을 함께 검토한다.

  - key: law:pipa-23
    kind: law
    title: 개인정보 보호법 제23조 — 민감정보의 처리 제한 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제23조
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          사상·신념, 노동조합·정당의 가입·탈퇴, 정치적 견해, 건강, 성생활 등에 관한 정보와 대통령령으로 정하는 정보(유전정보, 범죄경력자료, 특정 개인을 알아볼 목적의 생체인식정보, 인종·민족 정보 등)는 민감정보로서 처리가 제한된다.
          정보주체의 별도 동의를 받거나 법령에서 처리를 요구·허용하는 경우 등에 한해 처리할 수 있고, 유출 등이 없도록 안전성 확보에 필요한 조치를 해야 한다.
          진료기록 등 건강정보는 그 자체로 민감정보이므로 연구 활용 시 가명처리와 접근통제를 함께 적용한다.

  - key: law:pipa-24
    kind: law
    title: 개인정보 보호법 제24조 — 고유식별정보의 처리 제한 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제24조
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          법령에 따라 개인을 고유하게 구별하기 위해 부여된 식별정보(주민등록번호, 여권번호, 운전면허번호, 외국인등록번호 등)는 고유식별정보로서 별도 동의나 법령 근거가 있을 때에만 처리할 수 있다.
          처리할 때에는 암호화 등 안전성 확보 조치가 필요하다. 연구에서는 고유식별정보 대신 연구용 일련번호를 사용하는 것이 원칙이다.

  - key: law:pipa-24-2
    kind: law
    title: 개인정보 보호법 제24조의2 — 주민등록번호 처리의 제한 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제24조의2
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          주민등록번호는 법률·대통령령 등에서 구체적으로 처리를 요구하거나 허용한 경우, 정보주체 또는 제3자의 급박한 생명·신체·재산의 이익을 위해 명백히 필요한 경우 등 제한된 경우에만 처리할 수 있다.
          정보주체의 동의만으로 처리할 수 있는 것이 아니므로, 연구 목적으로 주민등록번호를 수집하는 계획은 원칙적으로 허용되기 어렵다.
          자료 연계가 필요하면 데이터관리자가 연계를 수행하고 연구자에게는 일련번호만 제공하도록 계획을 바꾼다.

  - key: law:pipa-28-2
    kind: law
    title: 개인정보 보호법 제28조의2 — 가명정보의 처리 등 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제28조의2
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          개인정보처리자는 통계작성, 과학적 연구, 공익적 기록보존 등을 위하여 정보주체의 동의 없이 가명정보를 처리할 수 있다.
          가명정보를 제3자에게 제공하는 경우에는 특정 개인을 알아보기 위하여 사용될 수 있는 정보를 포함해서는 안 된다.
          가명정보 처리 특례는 개인정보 보호법상 근거이며, 생명윤리법에 따른 기관위원회 심의(또는 면제 확인)와 동의 면제 승인은 별도로 필요하다.

  - key: law:pipa-28-3
    kind: law
    title: 개인정보 보호법 제28조의3 — 가명정보의 결합 제한 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제28조의3
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          서로 다른 개인정보처리자 간의 가명정보 결합은 개인정보보호위원회 또는 관계 중앙행정기관의 장이 지정하는 전문기관(결합전문기관)이 수행한다.
          결합된 정보를 결합을 수행한 기관 외부로 반출하려면 가명정보 또는 익명정보로 처리한 뒤 전문기관의 장의 승인을 받아야 한다.
          타 기관(예: 건강보험 자료, 타 병원 자료)과 결합하는 연구는 결합키 생성, 결합 장소, 반출 심사 계획을 연구계획서에 적는다.

  - key: law:pipa-28-4
    kind: law
    title: 개인정보 보호법 제28조의4 — 가명정보에 대한 안전조치의무 등 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제28조의4
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          가명정보를 처리할 때에는 원래 상태로 복원하기 위한 추가정보(매핑표, 암호화 키 등)를 별도로 분리하여 보관·관리하고, 분실·도난·유출·위조·변조·훼손이 없도록 기술적·관리적·물리적 조치를 해야 한다.
          가명정보 처리 기록(처리 목적, 처리 항목, 제공받는 자 등)을 작성·보관해야 하며, 처리 목적 등을 고려한 처리기간 설정 근거도 있다.
          개정으로 항 번호가 달라졌을 수 있으므로 인용할 때에는 원문의 항 번호를 확인한다.

  - key: law:pipa-28-5
    kind: law
    title: 개인정보 보호법 제28조의5 — 가명정보 처리 시 금지의무 등 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제28조의5
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          누구든지 특정 개인을 알아보기 위한 목적으로 가명정보를 처리해서는 안 된다(재식별 금지).
          가명정보를 처리하는 과정에서 특정 개인을 알아볼 수 있는 정보가 생성된 경우에는 즉시 처리를 중지하고 지체 없이 회수·파기해야 한다.

  - key: law:pipa-28-7
    kind: law
    title: 개인정보 보호법 제28조의7 — 가명정보의 적용 범위 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제28조의7
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          가명정보에 대해서는 정보주체에 대한 통지, 열람·정정·삭제·처리정지 요구 등 정보주체 권리 관련 일부 규정이 적용되지 않는다.
          적용이 제외되는 구체적 조항은 개정 이력에 따라 달라졌으므로 원문을 확인한다.

  - key: law:pipa-28-8
    kind: law
    title: 개인정보 보호법 제28조의8 — 개인정보의 국외 이전 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제28조의8
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          개인정보를 국외로 제공·처리위탁·보관하려면 정보주체의 별도 동의, 법률·조약의 근거, 이전받는 자의 인증, 이전받는 국가의 보호수준 인정 등 법에서 정한 요건 중 하나를 충족해야 한다.
          해외 공동연구, 해외 클라우드 분석 환경 사용은 국외 이전에 해당할 수 있으므로 이전 국가·기관·항목·보호조치를 연구계획서에 명시한다.

  - key: law:pipa-29
    kind: law
    title: 개인정보 보호법 제29조 — 안전조치의무 (요약 — 원문 확인 필요)
    ref: 개인정보 보호법 제29조
    url: https://www.law.go.kr/법령/개인정보보호법
    sections:
      - heading: 요지
        text: |
          개인정보처리자는 개인정보가 분실·도난·유출·위조·변조 또는 훼손되지 않도록 내부 관리계획 수립, 접근 권한 관리와 접근통제, 접속기록 보관, 암호화, 보안 프로그램 설치, 물리적 보관 조치 등 안전성 확보에 필요한 조치를 해야 한다.
          세부 기준은 「개인정보의 안전성 확보조치 기준」 고시를 따른다. 연구계획서에는 분석 장소, 접근권한자, 암호화, 반출 통제, 접속기록 관리를 구체적으로 적는다.

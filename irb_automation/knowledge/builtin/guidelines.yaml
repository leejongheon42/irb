# 지침·가이드라인 요약 — 원문이 아니며 개정 가능성이 있습니다. 최종 판단은 발행 기관의 원문을 확인하십시오.
version: "2026.11"
sources:
  - key: guide:health-data
    kind: guideline
    title: 보건의료데이터 활용 가이드라인 — 가명처리 절차 (요약 — 원문 확인 필요)
    ref: 보건의료데이터 활용 가이드라인(보건복지부·개인정보보호위원회)
    url: https://www.mohw.go.kr
    sections:
      - heading: 처리 절차(요지)
        text: |
          보건의료 데이터를 가명처리하여 활용하는 절차는 일반적으로 사전 준비(처리 목적 설정, 데이터심의위원회 구성), 위험성 검토, 가명처리, 적정성 검토, 안전한 관리의 단계로 설명된다.
          개인정보처리자는 처리 목적, 가명처리 방법, 처리 환경에 대해 데이터심의위원회의 승인을 받고, 가명처리 후에는 적정성 검토로 재식별 가능성이 없는지 확인한다.
          기관에 따라 IRB가 데이터심의위원회의 역할을 함께 수행하기도 하므로 기관 규정을 확인한다.
      - heading: 식별자·준식별자 처리 원칙(요지)
        text: |
          성명, 주민등록번호, 연락처, 상세주소, 이메일 등 직접 식별자는 삭제하고, 환자번호·보험가입자번호 등은 연구용 일련번호로 대체한다.
          생년월일은 연령 또는 연령 구간으로, 주소는 시군구·시도 단위로, 날짜는 연·월 단위 범주화 또는 대상자별 날짜 이동으로 처리하는 방식이 쓰인다.
          자유기술(경과기록·판독문)은 식별정보를 제거하고 검수하며, 필요하지 않으면 제외한다.
      - heading: 동의가 원칙인 정보(2020년 원안 기준 요지)
        text: |
          재식별 시 인권 침해 우려가 큰 정보(정신질환, 성매개감염병·HIV, 희귀질환, 학대·낙태 관련 정보 등)는 원칙적으로 동의를 받아 활용하도록 하였다.
          유전체 정보처럼 안전한 가명처리 방법이 확립되지 않은 정보도 동의를 받도록 하였다.
          2024년 1월 개정안이 발표되었으므로 현행 기준은 최종 확정본 원문을 확인한다.

  - key: guide:pseudonym-unstructured
    kind: guideline
    title: 가명정보 처리 가이드라인 — 비정형 데이터 기준 (요약 — 원문 확인 필요)
    ref: 가명정보 처리 가이드라인(개인정보보호위원회, 2024 개정)
    url: https://www.pipc.go.kr
    sections:
      - heading: 판단 방식(요지)
        text: |
          2024년 개정으로 이미지·영상·음성·텍스트 등 비정형 데이터의 가명처리 기준이 추가되었다.
          비정형 데이터는 어떤 정보가 식별 위험인지가 상황에 따라 다르므로 처리 목적, 처리 환경, 민감도를 종합해 개인식별 위험을 판단한다.
      - heading: 의료영상·텍스트(요지)
        text: |
          흉부 CT 영상처럼 그 자체로 식별 위험이 높지 않은 자료도 3차원 재건 기술 악용, 특이한 흉터 등은 위험 요소가 될 수 있다.
          영상은 필터링, 암호화, 얼굴 합성, 인페인팅, AI 기반 처리 등이, 텍스트는 마스킹, 정규표현식, 주석 처리 등이 제시된다.
      - heading: 처리 근거와 검수(요지)
        text: |
          완벽한 탐지 기술이 없으므로 가명처리 기술의 적절성·신뢰성을 확인할 근거를 작성·보관하고, 처리 결과를 자체 검수하며, 외부 전문가가 참여하는 적정성 검토를 하도록 권고한다.

  - key: guide:five-safes
    kind: guideline
    title: Five Safes — 안전한 연구데이터 접근 원칙 (요약)
    ref: Five Safes 프레임워크
    url: https://zenodo.org/record/5946892
    sections:
      - heading: 다섯 가지 안전
        text: |
          Safe projects(승인된 목적의 과제), Safe people(교육·서약한 연구자), Safe settings(통제된 분석 환경), Safe data(가명처리 등 최소화된 데이터), Safe outputs(공개 전 결과 점검)의 다섯 측면으로 데이터 접근 위험을 관리한다.
      - heading: 본 시스템과의 대응
        text: |
          Safe projects는 IRB 승인과 데이터 제공 게이트, Safe people은 연구윤리 교육 이수와 보안서약, Safe settings는 원내 분석 서버 등 보관 장소 통제, Safe data는 가명처리와 적정성 검토, Safe outputs는 결과 반출 심사에 대응한다.

  - key: guide:output-sdc
    kind: guideline
    title: 결과 반출 심사 — 소규모 셀 원칙 (요약)
    ref: 통계적 노출 통제(SDC) 실무
    url: https://zenodo.org/records/10055365
    sections:
      - heading: 최소 셀 기준
        text: |
          분석 결과를 분석 환경 밖으로 반출하기 전에 집계표의 빈도가 기관이 정한 최소 셀 크기(보통 5 또는 10) 미만인 칸이 있는지 확인한다.
          희귀질환처럼 집단이 작으면 더 높은 기준을 적용하기도 한다.
      - heading: 처리 방법
        text: |
          기준 미만 셀은 억제(예: "<5" 표기), 범주 병합, 반출 반려 중 하나로 처리한다.
          셀 하나만 억제하면 행·열 합계로 역산될 수 있으므로 합계 행과 다른 표까지 함께 보는 보완 억제를 검토한다.
          개인 단위 자료, 식별자, 자유기술은 반출 대상이 아니다.

  - key: guide:irb-accreditation
    kind: guideline
    title: 기관위원회 평가·인증과 연차보고 (요약 — 공고 원문 확인 필요)
    ref: 생명윤리법 제14조 · 국가생명윤리정책원 공고
    url: https://www.irb.or.kr
    sections:
      - heading: 요지
        text: |
          기관위원회 평가·인증은 생명윤리법 제14조에 근거하며 국가생명윤리정책원이 운영한다. 공고 기준 인증 유효기간은 3년이다.
          인증 기관은 연간 운영실적과 표준운영지침 변경사항 등을 연차보고한다. 일정과 제출 양식은 기관위원회 관리시스템 공고를 확인한다.

  - key: guide:feasibility
    kind: guideline
    title: IRB 승인 전 대상자 수 사전 조회 원칙 (참고)
    ref: 연구 설계 단계 집계 조회
    url: ""
    sections:
      - heading: 요지
        text: |
          연구 설계 단계에서는 조건에 맞는 환자 수를 집계값으로만 확인하고, 개인 단위 자료는 IRB 승인 후 가명처리를 거쳐 제공받는다.
          소규모 결과는 억제하고 반올림하여 표시하며, 조회 기록을 남기고 사용자별 조회 한도를 두어 여러 조건을 빼고 더해 개인을 추정하는 차분 공격을 막는다.

  - key: guide:reliance
    kind: guideline
    title: 다기관 연구의 단일 IRB·위임심의 (참고)
    ref: 다기관 공동연구 심의
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC6798516/
    sections:
      - heading: 요지
        text: |
          다기관 연구에서는 하나의 대표 IRB가 전체 기관을 심의하고, 참여기관은 위임 협약을 맺고 기관 고유 사항(local context: 자료 반출 범위, 보안, 기관 규정)만 확인하는 방식이 쓰인다.
          대표 IRB 승인서와 승인된 계획서 버전이 일치하는지, 참여기관별 연구책임자와 제공 자료 범위가 명시되었는지 확인한다.

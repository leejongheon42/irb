# 연구자 자주 묻는 질문. 기관 사정에 맞게 수정하거나 기관 FAQ를 업로드해 보완하십시오.
version: "2026.11"
sources:
  - key: faq:exemption
    kind: faq
    title: "FAQ: 의무기록 후향 연구는 심의면제가 되나요?"
    ref: 생명윤리법 제15조제2항 · 시행규칙 제13조
    sections:
      - heading: 답변
        text: |
          기존 자료·문서를 이용하고 연구자가 개인식별정보를 수집·기록하지 않으면 심의면제 대상이 될 수 있습니다.
          성명·등록번호·주민등록번호 등 식별자를 받거나, 연구자가 직접 가명처리하거나, 취약한 연구대상자·유전정보 등 기관 SOP상 제외 사유가 있으면 신속심의 이상으로 진행됩니다.
          면제 여부는 연구자가 정하지 않고 IRB가 확인합니다. 자동 사전검토 화면에서 면제 요건별 충족 여부를 미리 볼 수 있습니다.

  - key: faq:pseudonym-consent
    kind: faq
    title: "FAQ: 가명정보면 동의 없이 연구할 수 있나요?"
    ref: 개인정보 보호법 제28조의2 · 생명윤리법 제16조제3항
    sections:
      - heading: 답변
        text: |
          개인정보 보호법 제28조의2에 따라 과학적 연구 목적의 가명정보 처리는 정보주체 동의 없이 가능합니다.
          하지만 생명윤리법에 따른 IRB 심의(또는 면제 확인)는 별도로 필요하고, 서면동의를 받지 않으려면 동의 면제 승인이 필요합니다.
          보건의료데이터 활용 가이드라인은 정신질환·성매개감염병·희귀질환 등 일부 정보는 원칙적으로 동의를 받도록 하므로 해당 여부를 확인하십시오.

  - key: faq:waiver
    kind: faq
    title: "FAQ: 동의 면제는 어떻게 소명하나요?"
    ref: 생명윤리법 제16조제3항
    sections:
      - heading: 답변
        text: |
          두 요건을 모두 소명합니다. 첫째, 동의를 받는 것이 현실적으로 불가능하거나 연구 타당성을 크게 해치는 구체적 사유(대상자 수, 사망·추적 불가 비율, 선택편향)입니다.
          둘째, 동의 거부를 추정할 사유가 없고 연구대상자 위험이 극히 낮은 근거(가명처리, 접촉 없음, 원내 분석 환경)입니다. 서류 자동 작성의 동의 면제 사유서를 활용하십시오.

  - key: faq:identifiers
    kind: faq
    title: "FAQ: 등록번호(환자번호)를 꼭 받아야 하는데 가능한가요?"
    ref: 보건의료데이터 활용 가이드라인
    sections:
      - heading: 답변
        text: |
          가능하지만 필요성을 소명해야 하고 심의 수준이 올라갈 수 있습니다. 자료 연계가 목적이면 데이터관리자가 연계를 수행하고 연구자에게는 연구용 일련번호만 주는 방식을 먼저 검토하십시오.
          등록번호를 받는다면 사용 목적, 사용 후 삭제 시점, 보관 장소의 안전조치를 연구계획서에 적어야 합니다.

  - key: faq:rrn
    kind: faq
    title: "FAQ: 주민등록번호를 수집해도 되나요?"
    ref: 개인정보 보호법 제24조의2
    sections:
      - heading: 답변
        text: |
          주민등록번호는 법령 근거가 있는 경우에만 처리할 수 있어 연구 목적의 수집은 원칙적으로 어렵습니다. 자동 사전검토에서 필수 보완 사항으로 분류되며, 연구용 일련번호로 대체해야 합니다.

  - key: faq:output-review
    kind: faq
    title: "FAQ: 분석 결과를 밖으로 가져가려면 어떻게 하나요?"
    ref: 결과 반출 심사
    sections:
      - heading: 답변
        text: |
          결과 반출 심사 메뉴에서 결과표(CSV)를 올리면 소규모 셀(기본 5 미만), 식별자, 자유기술, 개인 단위 자료를 자동으로 점검합니다.
          지적 사항이 소규모 셀뿐이면 해당 칸을 "<5"로 가린 억제본이 자동으로 만들어지고, 데이터관리자가 원본 또는 억제본을 승인하면 내려받을 수 있습니다.

  - key: faq:destruction
    kind: faq
    title: "FAQ: 연구가 끝나면 자료는 언제 파기하나요?"
    ref: 기관 SOP
    sections:
      - heading: 답변
        text: |
          연구계획서에 적은 보관기간이 끝나면 복구할 수 없는 방법으로 파기하고 파기 확인서를 등록합니다.
          종료보고가 확인되면 보관기간에 따라 파기 기한이 자동으로 정해지고, 기한 60·30·7일 전과 기한 경과 시 알림이 갑니다.

  - key: faq:multicenter
    kind: faq
    title: "FAQ: 다기관 연구는 각 병원 IRB에서 모두 심의받아야 하나요?"
    ref: 생명윤리법 제12조 · 다기관 공동연구 심의
    sections:
      - heading: 답변
        text: |
          기관 규정에 따라 대표 IRB 심의 결과를 인정(위임심의)하거나 공동 심의 체계를 쓸 수 있습니다. 심의 방식에서 '타기관(대표) IRB 심의 결과 인정'을 고르고 대표 IRB 승인서를 첨부하면, 본원은 기관 고유 사항 중심으로 확인합니다.

  - key: faq:linkage
    kind: faq
    title: "FAQ: 건강보험 자료나 타 병원 자료와 결합하려면?"
    ref: 개인정보 보호법 제28조의3
    sections:
      - heading: 답변
        text: |
          서로 다른 기관의 가명정보 결합은 결합전문기관을 통해 수행해야 합니다. 연구계획서에 결합 대상, 결합키 생성 방법, 결합 장소, 반출 심사 계획을 적고, 결합 계획서를 첨부하십시오.

  - key: faq:continuing
    kind: faq
    title: "FAQ: 승인 기간이 끝나기 전에 무엇을 해야 하나요?"
    ref: 기관 SOP
    sections:
      - heading: 답변
        text: |
          연구를 계속하려면 만료 전에 지속심의를 신청해야 합니다. 만료 60·30·7일 전에 알림이 가며, 만료되면 자료 이용을 중단해야 하고 가명정보 다운로드도 차단됩니다.

  - key: faq:amendment
    kind: faq
    title: "FAQ: 승인 후 대상자 수나 변수를 바꾸려면?"
    ref: 기관 SOP
    sections:
      - heading: 답변
        text: |
          변경 신청을 시작해 내용을 수정한 뒤 변경심의를 제출합니다. 변경 대비표가 자동으로 만들어지며, 기존 승인은 변경 승인 전까지 유효합니다. 변경이 부결되면 승인된 내용으로 되돌아갑니다.

  - key: faq:feasibility
    kind: faq
    title: "FAQ: IRB 제출 전에 환자 수를 알 수 있나요?"
    ref: 사전 대상자 수 조회
    sections:
      - heading: 답변
        text: |
          대상자 수 사전 조회에서 진단코드·성별·연령·기간 조건으로 환자 수를 집계값으로 확인할 수 있습니다. 10명 미만은 "<10"으로 가리고 10명 단위로 반올림하며, 조회 기록이 남고 하루 조회 횟수가 제한됩니다.

  - key: faq:ai
    kind: faq
    title: "FAQ: AI 기능에 환자 정보가 전송되나요?"
    ref: 기관 정보보호 정책
    sections:
      - heading: 답변
        text: |
          AI 사전검토 보조와 근거 질의응답은 연구계획서 텍스트와 지식베이스 문서만 사용하며 환자 데이터는 보내지 않습니다. 질문에 연락처·주민등록번호 등이 들어 있으면 전송 전에 자동으로 가립니다.
          AI 기능은 기관 정보보호 부서의 승인 후에만 켜야 하며, 꺼져 있으면 자동 발췌 방식으로 답합니다.

  - key: faq:drb
    kind: faq
    title: "FAQ: 가명처리된 자료는 언제 받을 수 있나요?"
    ref: 보건의료데이터 활용 가이드라인
    sections:
      - heading: 답변
        text: |
          IRB 승인(또는 면제 확인) 후 데이터관리자가 가명처리하고, 처리자와 다른 위원이 적정성 검토를 승인하면 연구팀에 제공됩니다. 외부 제공 과제는 자료 제공 계약도 유효해야 합니다.

  - key: faq:security
    kind: faq
    title: "FAQ: 가명정보는 어디서 분석해야 하나요?"
    ref: 개인정보 보호법 제29조
    sections:
      - heading: 답변
        text: |
          연구계획서에 승인된 장소(보통 원내 분석전용 서버)에서만 분석합니다. 개인 PC나 외부 클라우드로 복사하지 말고, 결과는 반출 심사를 거쳐 가져가십시오.

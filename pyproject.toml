[project]
name = "irb-automation"
version = "2.0.0"
description = "병원 의료데이터 활용 연구를 위한 IRB 심의 자동화 솔루션"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
ai = ["anthropic>=2.5"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
irb-automation = "irb_automation.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["irb_automation*"]

[tool.setuptools.package-data]
irb_automation = ["rules/*.yaml", "web/templates/**/*.html", "web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:The default date adapter is deprecated:DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "B008", "B905"]
